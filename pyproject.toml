[project]
name = "dunning-agent"
version = "0.1.0"
description = "Voice-led dunning agent that recovers failed Razorpay subscription payments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    # zoneinfo has no tz database on Windows; the contact-window rule needs one.
    "tzdata>=2024.2",
]

[dependency-groups]
# Pipecat transport, as an alternative to LiveKit. Pinned to the current major:
# the Blostem backend runs 0.0.108 and its frame processors are not API
# compatible with 1.x, so only its pure-logic modules were ported.
pipecat = [
    "pipecat-ai[silero,google,cartesia,webrtc,mcp]~=1.7",
    "sarvamai>=0.1.28",
    "python-dotenv",
    "pipecat-ai-prebuilt>=1.0.5",
]

# Not installed by default: the webhook service's container has no need for
# the voice stack, and these pull in onnxruntime and friends.
voice = [
    "livekit-agents[silero,turn-detector]~=1.5",
    "livekit-plugins-sarvam",
    "livekit-plugins-google",
    "livekit-plugins-cartesia",
    "livekit-api",
    # The plugins read their keys from os.environ, so .env must be loaded.
    "python-dotenv",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates long column definitions; not worth hand-wrapping.
"alembic/versions/*.py" = ["E501"]
# FastAPI's Depends()/Header() in argument defaults is the framework's idiom.
"app/webhooks/router.py" = ["B008"]
