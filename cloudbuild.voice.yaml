steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.voice
      - -t
      - asia-south1-docker.pkg.dev/dunning-agent/cloud-run-source-deploy/dunning-voice:v8
      - .
images:
  - asia-south1-docker.pkg.dev/dunning-agent/cloud-run-source-deploy/dunning-voice:v8
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
